# HookSwap web — INTERNAL nginx config (runs inside the nginx:alpine container).
# Serves the prebuilt Vite SPA (apps/web/build/client/) that is bind-mounted at /usr/share/nginx/html.
# This container listens on :80 and is published to 127.0.0.1:8080 on the host; the HOST nginx
# fronts hookswap.org and proxies to it. TLS + real hostnames live on the host, not here.
#
# Client-side routes (/, /swap, /perps, /locker, /lock/:c/:id, /launch, /positions, /explore, ...)
# are all handled by React Router — every non-file path MUST fall back to /index.html.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- gzip (assets are already compressible; brotli not in nginx:alpine base) ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        application/manifest+json application/wasm
        image/svg+xml font/ttf font/woff font/woff2;

    # Let the host nginx / CDN decide; keep the container honest about what it is.
    server_tokens off;

    # ---- Hashed build assets: content-hashed filenames → cache forever, immutable ----
    # Vite emits /assets/*.[hash].{js,css} and fingerprinted media. Safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Fingerprinted fonts bundled by the app (Inter / IBM Plex / Space Grotesk).
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Brand imagery (og/watermark/logos) — real files under the root. Cache a day; do NOT
    # SPA-fallback (a missing brand asset must 404, not return HTML).
    location /brand/ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location /images/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Wallet / deep-link association files — must be served verbatim, never SPA-fallback.
    # apple-app-site-association has no extension and must be application/json.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        try_files $uri =404;
    }
    location /.well-known/ {
        try_files $uri =404;
    }

    # service worker / manifest — short cache so updates propagate fast.
    location = /service-worker.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
    location = /site.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # ---- index.html: never cache, so new deploys are picked up immediately ----
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ---- SPA fallback: any unmatched path → index.html so React Router can route it ----
    # Covers /swap, /perps, /locker, /lock/<chain>/<id>, /launch, /explore, /positions, etc.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health probe for compose/host checks.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}

# HOST nginx — http-level map for websocket Connection upgrade.
# Drop into /etc/nginx/conf.d/ (loaded at http{} scope, NOT sites-available).
# Required by perps.hookswap.org.conf's `proxy_set_header Connection $connection_upgrade;`.
# The 00- prefix ensures it loads before the vhosts. If the host already defines
# $connection_upgrade elsewhere (nginx errors on a duplicate map), delete this file.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

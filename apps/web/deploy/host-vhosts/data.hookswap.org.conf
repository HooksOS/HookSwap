# HOST nginx vhost — data.hookswap.org -> data-api (127.0.0.1:4092),
# with /locker/ carved out to the locker-indexer (127.0.0.1:4205) BEFORE the catch-all.
# Mirrors the old box: the locker-indexer serves its own paths, everything else = data-api.
# Plain :80 only — certbot adds TLS afterwards.

server {
    listen 80;
    listen [::]:80;
    server_name data.hookswap.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Locker indexer — MUST come before `location /`. Trailing slash on proxy_pass
    # strips the /locker/ prefix so the indexer sees its own root paths.
    location /locker/ {
        proxy_pass http://127.0.0.1:4205/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:4092;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

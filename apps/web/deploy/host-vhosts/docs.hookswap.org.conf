# HOST nginx vhost — docs.hookswap.org.
# The old box serves docs from a STATIC root (/var/www/docs.hookswap.org). Populating that
# root (the docs publish) is a SEPARATE task — this vhost just wires the domain so certbot
# can issue a cert now. Default = static root (matches old box); an alternate proxy block
# is included commented-out in case docs later moves to a container.
# Plain :80 only — certbot adds TLS afterwards.

server {
    listen 80;
    listen [::]:80;
    server_name docs.hookswap.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ---- OPTION 1 (default, mirrors old box): static root ----
    root /var/www/docs.hookswap.org;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # ---- OPTION 2: proxy to a docs container instead (uncomment, comment out the root/location above) ----
    # location / {
    #     proxy_pass http://127.0.0.1:8081;   # pick a free port; not yet assigned
    #     proxy_http_version 1.1;
    #     proxy_set_header Host              $host;
    #     proxy_set_header X-Real-IP         $remote_addr;
    #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}

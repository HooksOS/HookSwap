# HOST nginx vhost — hookswap.org (+ www) -> web container (127.0.0.1:8080).
# Drop into /etc/nginx/sites-available/hookswap.org and symlink into sites-enabled.
# Plain :80 only — run certbot afterwards to add the TLS server block + redirect.
# ADDITIVE: does not touch existing hookos vhosts.

server {
    listen 80;
    listen [::]:80;
    server_name hookswap.org www.hookswap.org;

    # Allow certbot HTTP-01 challenges even before TLS is issued.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }
}

# HOST nginx vhost — perps.hookswap.org -> perps engine (127.0.0.1:4110).
# NOTE: perps moved OFF 4100 to 4110 on the new box.
# Plain :80 only — certbot adds TLS afterwards.

server {
    listen 80;
    listen [::]:80;
    server_name perps.hookswap.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:4110;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Perps desk uses websockets for live orderbook/marks — allow upgrade.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}

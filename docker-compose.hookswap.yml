# HookSwap — isolated stack on the shared Hivelocity box (198.244.167.106).
# Own containers (hookswap-*), own network (hookswap-net), own high ports bound to
# 127.0.0.1 (host nginx terminates TLS + proxies the public domains). Log rotation on
# every service so no container can leak disk. Secrets live in ./secrets/*.env (mounted
# at runtime, rsync'd from the old box — never baked into images). Nothing here touches
# the existing hookos/protocol stack.
name: hookswap

networks:
  hookswap-net:
    name: hookswap-net

volumes:
  data-api-db:
  locker-data:

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---- locker + farms indexer (read-only RPC; no secrets) — LIVE ----
  locker-indexer:
    build: ./locker-indexer
    image: hookswap/locker-indexer:latest
    container_name: hookswap-locker-indexer
    restart: unless-stopped
    ports:
      - "127.0.0.1:4205:4205"
    environment:
      - PORT=4205
      - LOCKER_REFRESH_MS=300000
    networks: [hookswap-net]
    logging: *default-logging
    volumes:
      - locker-data:/app/data

  # ---- markets / token data api ----
  data-api:
    build: ./data-api
    image: hookswap/data-api:latest
    container_name: hookswap-data-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:4092:4092"
    env_file:
      - ./secrets/data-api.env
    environment:
      # Override the old box's absolute INDEXER_DB_PATH — point at the mounted volume
      # so the event-indexer (which drives token USD pricing) can open its SQLite DB.
      - INDEXER_DB_PATH=/data/indexer.db
    volumes:
      - data-api-db:/data
    networks: [hookswap-net]
    logging: *default-logging

  # ---- perps matching engine (HTTP+WS :4110; 4100 is taken on this box) ----
  perps-engine:
    build: ./perps-engine
    image: hookswap/perps:latest
    container_name: hookswap-perps-engine
    restart: unless-stopped
    command: node_modules/.bin/tsx src/index.ts
    env_file:
      - ./secrets/perps-engine.env
    environment:
      - PORT=4110
    ports:
      - "127.0.0.1:4110:4110"
    networks: [hookswap-net]
    logging: *default-logging

  perps-bot:
    image: hookswap/perps:latest
    container_name: hookswap-perps-bot
    restart: unless-stopped
    command: node_modules/.bin/tsx bot/bot.ts
    env_file:
      - ./secrets/perps-bot.env
    environment:
      - ENGINE_URL=http://hookswap-perps-engine:4110
    depends_on: [perps-engine]
    networks: [hookswap-net]
    logging: *default-logging

  perps-keeper:
    image: hookswap/perps:latest
    container_name: hookswap-perps-keeper
    restart: unless-stopped
    command: node_modules/.bin/tsx keeper/keeperMain.ts
    env_file:
      - ./secrets/perps-keeper.env
    networks: [hookswap-net]
    logging: *default-logging

  # ---- routing / quote adapter (embed SOR; the proven working tree bind-mounted:
  #      adapter + smart-order-router fork + vendored sdk-core, jsbi-deduped) ----
  trading-adapter:
    image: node:22-slim
    container_name: hookswap-trading-adapter
    restart: unless-stopped
    working_dir: /app/hookswap-adapter-embed
    command: node dist/server.js
    env_file:
      - ./adapter/hookswap-adapter-embed/.env
      - ./adapter/hookswap-adapter-embed/config/rpc.env
    environment:
      - PORT=4090
      - CORS_ALLOW_ORIGIN=https://hookswap.org,https://www.hookswap.org
    volumes:
      - ./adapter:/app
    ports:
      - "127.0.0.1:4090:4090"
    networks: [hookswap-net]
    logging: *default-logging

  # ---- web frontend (static SPA served by nginx; built dir bind-mounted) ----
  web:
    image: nginx:alpine
    container_name: hookswap-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./web/client:/usr/share/nginx/html:ro
      - ./web/spa.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [hookswap-net]
    logging: *default-logging

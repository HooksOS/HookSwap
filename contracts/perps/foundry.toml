[profile.default]
src = "src"
out = "out"
libs = ["lib"]
script = "script"
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"

# Dependencies are NOT vendored in this repo (keeps the tree small).
# Install them once with:
#   forge install OpenZeppelin/openzeppelin-contracts@v5.0.2 --no-commit
#   forge install foundry-rs/forge-std --no-commit
# (or add them as git submodules — see README.md "Dependencies").
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
# Sepolia FIRST — the canonical HookSwap validation chain (chainId 11155111).
sepolia = "${SEPOLIA_RPC_URL}"
# Additional HookSwap chains (deploy ONLY after Sepolia validation passes).
robinhood = "${ROBINHOOD_RPC_URL}"
megaeth = "${MEGAETH_RPC_URL}"
ink = "${INK_RPC_URL}"
xlayer = "${XLAYER_RPC_URL}"
hyperevm = "${HYPEREVM_RPC_URL}"
tempo = "${TEMPO_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api-sepolia.etherscan.io/api" }

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"
number_underscore = "preserve"

# ============================================================================
# HookSwap AI Knowledge Platform — DEV stack (docker-compose)
# ----------------------------------------------------------------------------
# Brings up the full platform locally:
#   datastores : postgres(pgvector) · redis · qdrant · opensearch(+dashboards) · minio(S3)
#   services   : backend(FastAPI) · frontend(Next15) · ingestion-workers · agents-runtime
#
#   cp infra/env/.env.example .env   # then edit secrets/keys
#   docker compose up -d             # or: make up
#
# Production overlay (TLS/nginx, 127.0.0.1 binds, resource limits):
#   docker compose -f docker-compose.yml -f docker-compose.production.yml up -d
#
# Service Dockerfiles are owned by each subsystem dir; infra/docker/*.Dockerfile
# are FALLBACKS used only when a subsystem has not shipped its own yet.
# ============================================================================

name: hookswap-ai-platform

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # DATASTORES
  # ---------------------------------------------------------------------------
  postgres:
    <<: [*restart, *logging]
    image: pgvector/pgvector:pg16
    container_name: aiplat-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hookswap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hookswap}
      POSTGRES_DB: ${POSTGRES_DB:-hookswap_ai}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hookswap} -d ${POSTGRES_DB:-hookswap_ai}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [data]

  redis:
    <<: [*restart, *logging]
    image: redis:7-alpine
    container_name: aiplat-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [data]

  qdrant:
    <<: [*restart, *logging]
    image: qdrant/qdrant:v1.12.4
    container_name: aiplat-qdrant
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
      QDRANT__LOG_LEVEL: ${QDRANT_LOG_LEVEL:-INFO}
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"   # REST
      - "${QDRANT_GRPC_PORT:-6334}:6334"   # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # qdrant image has no curl/wget; use the bundled TCP probe via bash /dev/tcp
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks: [data]

  opensearch:
    <<: [*restart, *logging]
    image: opensearchproject/opensearch:2.17.1
    container_name: aiplat-opensearch
    environment:
      discovery.type: single-node
      cluster.name: aiplat-search
      node.name: aiplat-os-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms${OPENSEARCH_HEAP:-512m} -Xmx${OPENSEARCH_HEAP:-512m}"
      # dev convenience — production overlay hardens/keeps security plugin
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "${OPENSEARCH_DISABLE_SECURITY:-true}"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-Hookswap_Dev#2026}
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
      - "${OPENSEARCH_MONITOR_PORT:-9600}:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [data]

  opensearch-dashboards:
    <<: [*restart, *logging]
    image: opensearchproject/opensearch-dashboards:2.17.1
    container_name: aiplat-opensearch-dashboards
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "${OPENSEARCH_DISABLE_SECURITY:-true}"
    ports:
      - "${OPENSEARCH_DASHBOARDS_PORT:-5601}:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    networks: [data]
    profiles: ["dashboards", "full"]

  minio:
    <<: [*restart, *logging]
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: aiplat-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-hookswap}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-hookswap-minio-secret}
      MINIO_REGION: ${S3_REGION:-us-east-1}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"      # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001"  # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    networks: [data]

  # one-shot: create the platform bucket(s) once minio is healthy
  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    container_name: aiplat-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-hookswap} ${S3_SECRET_ACCESS_KEY:-hookswap-minio-secret} &&
      mc mb --ignore-existing local/${S3_BUCKET:-hookswap-ai} &&
      mc mb --ignore-existing local/${S3_BUCKET_RAW:-hookswap-ai-raw} &&
      mc anonymous set download local/${S3_BUCKET:-hookswap-ai} || true;
      echo 'minio buckets ready';
      "
    networks: [data]
    restart: "no"

  # ---------------------------------------------------------------------------
  # APPLICATION SERVICES
  # ---------------------------------------------------------------------------
  backend:
    <<: [*restart, *logging]
    build:
      # Prefer the subsystem's own Dockerfile; falls back to infra/docker.
      context: ./backend
      dockerfile: ${BACKEND_DOCKERFILE:-Dockerfile}
    image: ${REGISTRY:-ghcr.io/hookswap}/ai-backend:${IMAGE_TAG:-dev}
    container_name: aiplat-backend
    env_file: [.env]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hookswap}:${POSTGRES_PASSWORD:-hookswap}@postgres:5432/${POSTGRES_DB:-hookswap_ai}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      OPENSEARCH_URL: http://opensearch:9200
      S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [data, edge]

  frontend:
    <<: [*restart, *logging]
    build:
      context: ./frontend
      dockerfile: ${FRONTEND_DOCKERFILE:-Dockerfile}
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws}
    image: ${REGISTRY:-ghcr.io/hookswap}/ai-frontend:${IMAGE_TAG:-dev}
    container_name: aiplat-frontend
    env_file: [.env]
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health || curl -fsS http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [edge]

  ingestion-workers:
    <<: [*restart, *logging]
    build:
      context: ./ingestion
      dockerfile: ${WORKER_DOCKERFILE:-Dockerfile}
    image: ${REGISTRY:-ghcr.io/hookswap}/ai-ingestion-workers:${IMAGE_TAG:-dev}
    container_name: aiplat-ingestion-workers
    env_file: [.env]
    environment:
      APP_ENV: ${APP_ENV:-development}
      WORKER_ROLE: ingestion
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hookswap}:${POSTGRES_PASSWORD:-hookswap}@postgres:5432/${POSTGRES_DB:-hookswap_ai}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      OPENSEARCH_URL: http://opensearch:9200
      S3_ENDPOINT_URL: http://minio:9000
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      minio: { condition: service_healthy }
    networks: [data]

  agents-runtime:
    <<: [*restart, *logging]
    build:
      context: ./agents
      dockerfile: ${AGENTS_DOCKERFILE:-Dockerfile}
    image: ${REGISTRY:-ghcr.io/hookswap}/ai-agents-runtime:${IMAGE_TAG:-dev}
    container_name: aiplat-agents-runtime
    env_file: [.env]
    environment:
      APP_ENV: ${APP_ENV:-development}
      WORKER_ROLE: agents
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hookswap}:${POSTGRES_PASSWORD:-hookswap}@postgres:5432/${POSTGRES_DB:-hookswap_ai}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      OPENSEARCH_URL: http://opensearch:9200
      BACKEND_URL: http://backend:8000
    depends_on:
      backend: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [data, edge]

networks:
  # edge   : reachable services (backend/frontend/agents public surface)
  # data   : datastores + workers (kept off the public surface)
  edge:
    driver: bridge
  data:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  opensearch-data:
  minio-data:

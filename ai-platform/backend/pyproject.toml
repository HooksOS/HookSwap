[project]
name = "hookswap-ai-platform-backend"
version = "0.1.0"
description = "HookSwap AI Knowledge Platform — RAG engine, retrieval, multi-tenant API (FastAPI, async)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
authors = [{ name = "HookSwap" }]

dependencies = [
    # --- web / api ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "strawberry-graphql[fastapi]>=0.235.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    # --- data / persistence ---
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "pgvector>=0.3.0",
    # --- vector / search ---
    "qdrant-client>=1.9.0",
    "opensearch-py>=2.6.0",
    "rank-bm25>=0.2.2",
    # --- llm / embeddings ---
    "openai>=1.40.0",
    "anthropic>=0.34.0",
    "google-generativeai>=0.7.0",
    "httpx>=0.27.0",
    "tiktoken>=0.7.0",
    # --- utils ---
    "numpy>=1.26.0",
    "tenacity>=8.4.0",
    "structlog>=24.1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "orjson>=3.10.0",
]

[project.optional-dependencies]
local-embeddings = [
    "sentence-transformers>=3.0.0",
    "torch>=2.2.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
ignore_missing_imports = true

# HookSwap AI Platform — nginx main config (production overlay edge proxy)
user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout  65;
    server_tokens off;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time';
    access_log  /var/log/nginx/access.log  main;

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # upstreams (docker-compose service DNS on the edge network)
    upstream ai_backend  { server backend:8000;  keepalive 32; }
    upstream ai_frontend { server frontend:3000; keepalive 32; }

    # basic rate limit for the API surface
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # request body size for uploads/ingestion
    client_max_body_size 50m;

    include /etc/nginx/conf.d/*.conf;
}

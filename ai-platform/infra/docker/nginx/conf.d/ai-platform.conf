# ============================================================================
# ai.hookswap.org   -> frontend (Next.js 15)
# api.hookswap.org  -> backend  (FastAPI: REST + GraphQL + WebSocket)
# TLS via certbot (/etc/letsencrypt). ACME http-01 challenge served over :80.
# ============================================================================

# ---- HTTP: ACME challenge + redirect to HTTPS ------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ai.hookswap.org api.hookswap.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- FRONTEND: ai.hookswap.org --------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ai.hookswap.org;

    ssl_certificate     /etc/letsencrypt/live/ai.hookswap.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.hookswap.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://ai_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;       # Next HMR/websocket
        proxy_set_header Connection "upgrade";
    }
}

# ---- BACKEND API: api.hookswap.org ----------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.hookswap.org;

    ssl_certificate     /etc/letsencrypt/live/api.hookswap.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.hookswap.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    # CORS is handled by FastAPI; nginx just proxies.

    # WebSocket streaming (chat / live tokens)
    location /ws {
        proxy_pass http://ai_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;      # long-lived streams
        proxy_send_timeout 3600s;
    }

    location / {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://ai_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;        # LLM/RAG responses can be slow
    }

    location = /health {
        proxy_pass http://ai_backend/health;
        access_log off;
    }
}
